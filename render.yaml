services:
  - type: web
    name: campus-impact-twin-api
    runtime: docker
    plan: free
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MQTT_ENABLED
        value: "false"
      - key: INTELLIGENCE_ENABLED
        value: "true"
      - key: VISION_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEFAULT_CAMPUS_CODE
        value: "CIT-MAIN"
