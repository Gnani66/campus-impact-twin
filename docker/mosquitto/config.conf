# =========================================================
# SMART CAMPUS DIGITAL TWIN — LOCAL DEVELOPMENT BROKER
#
# NOT A PRODUCTION CONFIGURATION.
#
# This broker allows anonymous, unauthenticated access from
# any client that can reach port 1883, and it stores nothing
# on disk. It exists so the telemetry simulator and the
# FastAPI worker can run on a laptop.
#
# Before any deployment that is reachable off localhost:
#   - set `allow_anonymous false`
#   - add `password_file` and `allow_anonymous false`
#   - terminate TLS on 8883 (`cafile`, `certfile`, `keyfile`)
#   - set `persistence true` and mount a volume for the store
#
# =========================================================

# ------------------------------------------------------------
# LISTENER
# ------------------------------------------------------------

# Mosquitto 2.x binds to localhost only unless a listener is
# declared, so the port must be declared explicitly for the
# container's network to reach it.
listener 1883

# Standard MQTT port. Docker publishes it on 127.0.0.1 only
# (see docker-compose.yml), so the broker is unreachable from
# other machines even though the port is open.
protocol mqtt

# ------------------------------------------------------------
# ACCESS CONTROL — LOCAL DEMO ONLY
# ------------------------------------------------------------

# No username, no password, no TLS. Anything that can open a
# socket to 1883 can publish and subscribe to every topic.
allow_anonymous true

# ------------------------------------------------------------
# BEHAVIOUR
# ------------------------------------------------------------

# No volume is mounted for the persistence store, so the broker
# must not try to write one.
persistence false

# Telemetry is published every 5s and read immediately by the
# FastAPI worker, so there is nothing to queue while clients
# are briefly disconnected. Messages are not retained by the
# broker; last-value state lives in the application.
max_queued_messages 1000

# Log to stdout so `docker compose logs mosquitto` shows
# connections, publishes and errors.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Slightly noisy at 1 message/second, but essential while
# wiring up the pipeline.
connection_messages true